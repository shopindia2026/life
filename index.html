<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS – Your everyday digital toolkit</title>
<meta name="description" content="Free tools for documents, money, jobs, study and everyday digital work.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f7f5f0;--fg:#14213d;--card:#fff;--line:#14213d1f;--acc:#e07a1f;--btn:#14213d;--btnfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1624;--fg:#eef1f6;--card:#ffffff0d;--line:#ffffff24;--btn:#e07a1f;--btnfg:#14213d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header a{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;color:inherit;text-decoration:none}
main{max-width:860px;margin:0 auto;padding:28px 16px}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 10px}
h2{margin:0 0 4px;font-size:17px}
.sub{font-size:18px;opacity:.8;max-width:560px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;margin:12px 0 4px;font-size:14px;font-weight:500}
.btn{display:inline-block;margin-top:12px;padding:10px 16px;border:0;border-radius:10px;background:var(--btn);color:var(--btnfg);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:20px}
.card{display:block;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}
.ico{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:transparent;color:inherit;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btnfg)}
.res{margin-top:16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.big{font-size:28px;font-weight:700}
.note{font-size:13px;opacity:.7;margin-top:14px}
.err{color:#c0392b;margin-top:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
footer{max-width:860px;margin:0 auto;padding:24px 16px;font-size:13px;opacity:.7}
details{margin-top:8px}
@media(prefers-reduced-motion:no-preference){a.card{transition:border-color .15s}}
.cv{background:#fff;color:#111;padding:28px;border:1px solid var(--line);border-radius:8px;margin-top:20px;font-size:14px}
.cv h1{margin:0;font-size:28px;font-family:inherit}.cv h3{margin:16px 0 4px;font-size:14px;border-bottom:1px solid #999;padding-bottom:2px}
.cv ul{margin:4px 0;padding-left:18px}.cv p{margin:4px 0;white-space:pre-line}
.cv1{font-family:Georgia,serif;text-align:center}.cv1 ul,.cv1 p{text-align:left}
.cv2{font-family:"Instrument Sans",sans-serif}.cv2 h1,.cv2 h3{color:#0f766e;border-color:#0f766e}
.cv3{font-family:"Instrument Sans",sans-serif;border-left:8px solid #e07a1f}.cv3 h3{border:0;color:#e07a1f}
@media print{body *{visibility:hidden}.cv,.cv *{visibility:visible}.cv{position:absolute;left:0;top:0;width:100%;border:0;margin:0}}
</style>
</head>
<body>
<header><a href="#/">LifeOS</a><span style="font-size:14px;opacity:.7">Free tools. Your files stay on your device.</span></header>
<main id="app"></main>
<footer>Calculators are informational only and not financial advice. File tools run in your browser; nothing is uploaded.<br><a href="#/privacy">Privacy Policy</a> · <a href="#/terms">Terms of Service</a></footer>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const inr=n=>Number.isFinite(n)?n.toLocaleString("en-IN",{maximumFractionDigits:2}):"–";
const T=[];

// ---------- helper for simple calculators ----------
function calc(slug,title,cat,icon,desc,kw,fields,fn,formula){
  T.push({slug,title,cat,icon,desc,kw,faq:[["How is it calculated?",formula]],render(box){
    box.innerHTML=fields.map(f=>`<label for="${f[0]}">${f[1]}</label><input id="${f[0]}" type="number" step="${f[3]||"any"}" value="${f[2]}">`).join("")+
      `<div class="res" aria-live="polite" id="out"></div><p class="note">Formula: ${formula}</p>`;
    const run=()=>{const v={};fields.forEach(f=>v[f[0]]=parseFloat($("#"+f[0]).value));
      $("#out").innerHTML=fields.some(f=>!Number.isFinite(v[f[0]]))?"Enter all values to see the result.":fn(v)};
    box.addEventListener("input",run);run();}});
}
calc("emi-calculator","EMI Calculator","Money","💰","Monthly instalment, total interest and total payment.",["loan","emi","home","car","interest"],
 [["p","Loan amount (₹)",500000],["r","Interest rate (% per year)",9,"0.1"],["y","Tenure (years)",5]],
 v=>{const r=v.r/1200,n=v.y*12;if(v.p<=0||n<=0)return"Loan amount and tenure must be above 0.";
  const e=r===0?v.p/n:v.p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  return `Monthly EMI<div class="big">₹${inr(e)}</div>Total interest: ₹${inr(e*n-v.p)}<br>Total payment: ₹${inr(e*n)}`},
 "EMI = P × r × (1+r)<sup>n</sup> ÷ ((1+r)<sup>n</sup> − 1), r = yearly rate ÷ 12 ÷ 100, n = months");
calc("simple-interest-calculator","Simple Interest Calculator","Money","🏦","Interest on a principal over time at a fixed rate.",["si","interest","principal"],
 [["p","Principal (₹)",100000],["r","Rate (% per year)",8,"0.1"],["t","Time (years)",3]],
 v=>`Interest<div class="big">₹${inr(v.p*v.r*v.t/100)}</div>Total amount: ₹${inr(v.p+v.p*v.r*v.t/100)}`,"SI = P × R × T ÷ 100");
calc("compound-interest-calculator","Compound Interest Calculator","Money","📈","See how savings grow with yearly compounding.",["ci","interest","savings","growth"],
 [["p","Principal (₹)",100000],["r","Rate (% per year)",8,"0.1"],["t","Time (years)",5],["n","Compounds per year",1]],
 v=>{const a=v.p*Math.pow(1+v.r/100/v.n,v.n*v.t);return `Final amount<div class="big">₹${inr(a)}</div>Interest earned: ₹${inr(a-v.p)}`},
 "A = P × (1 + r/n)<sup>n×t</sup>");
calc("gst-calculator","GST Calculator","Money","🧾","Add or remove GST from a price.",["gst","tax","invoice"],
 [["a","Amount (₹)",1000],["g","GST rate (%)",18,"0.1"]],
 v=>`<b>Add GST:</b> ₹${inr(v.a)} + ₹${inr(v.a*v.g/100)} GST = <span class="big">₹${inr(v.a*(1+v.g/100))}</span><br><br><b>Remove GST</b> (amount includes GST): base price ₹${inr(v.a/(1+v.g/100))}, GST ₹${inr(v.a-v.a/(1+v.g/100))}`,
 "Add: amount × (1 + rate/100). Remove: amount ÷ (1 + rate/100)");
calc("discount-calculator","Discount Calculator","Money","🏷️","Find the final price after a discount.",["sale","offer","price"],
 [["p","Original price (₹)",2000],["d","Discount (%)",25,"0.1"]],
 v=>`You pay<div class="big">₹${inr(v.p*(1-v.d/100))}</div>You save: ₹${inr(v.p*v.d/100)}`,"Final = price × (1 − discount/100)");
calc("percentage-calculator","Percentage Calculator","Students","🎓","X% of Y, what percent X is of Y, and change.",["percent","marks","increase","decrease"],
 [["a","X",20],["b","Y",500]],
 v=>`${v.a}% of ${v.b} = <b>${inr(v.a/100*v.b)}</b><br>${v.a} is <b>${inr(v.a/v.b*100)}%</b> of ${v.b}<br>Change from ${v.a} to ${v.b}: <b>${inr((v.b-v.a)/v.a*100)}%</b>`,
 "X% of Y = X ÷ 100 × Y; change = (new − old) ÷ old × 100");

// ---------- CGPA ----------
T.push({slug:"cgpa-calculator",title:"CGPA Calculator",cat:"Students",icon:"🎓",desc:"Average of your semester SGPAs (equal weight).",kw:["gpa","sgpa","marks","college"],
 faq:[["How to convert to percentage?","Many Indian universities use CGPA × 9.5, but check your own university's rule."]],
 render(box){box.innerHTML=`<label for="s">SGPA of each semester, separated by commas</label><input id="s" placeholder="8.2, 7.9, 8.5"><div class="res" id="out" aria-live="polite">Enter your SGPAs.</div><p class="note">CGPA = sum of SGPAs ÷ number of semesters. Use credit-weighted values if your university requires it.</p>`;
  $("#s").oninput=e=>{const a=e.target.value.split(",").map(x=>parseFloat(x)).filter(Number.isFinite);
   $("#out").innerHTML=a.length?`CGPA<div class="big">${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2)}</div>Approx. percentage (×9.5): ${(a.reduce((x,y)=>x+y,0)/a.length*9.5).toFixed(1)}%`:"Enter your SGPAs."}}});

// ---------- QR ----------
T.push({slug:"qr-code-generator",title:"QR Code Generator",cat:"Everyday Tools",icon:"📱",desc:"Make a QR code for any link or text.",kw:["qr","link","url","code"],
 faq:[["Does the QR code expire?","No. It stores your text directly."]],
 render(box){box.innerHTML=`<label for="t">Link or text</label><textarea id="t" rows="3" maxlength="800" placeholder="https://example.com"></textarea><button class="btn" id="go">Generate QR</button><p class="err" id="e" role="alert"></p><div id="q" style="margin-top:14px"></div>`;
  $("#go").onclick=()=>{const t=$("#t").value.trim(),q=$("#q");q.innerHTML="";$("#e").textContent="";
   if(!t)return $("#e").textContent="Enter a link or text first.";
   if(typeof QRCode==="undefined")return $("#e").textContent="QR library could not load. Check your internet and refresh.";
   new QRCode(q,{text:t,width:240,height:240});
   setTimeout(()=>{const c=$("canvas",q);if(c){const a=el('<a class="btn" download="qr.png">Download PNG</a>');a.href=c.toDataURL("image/png");q.appendChild(document.createElement("br"));q.appendChild(a)}},150)}}});

// ---------- Image compressor ----------
T.push({slug:"image-compressor",title:"Image Compressor",cat:"Documents",icon:"🗜️",desc:"Reduce image file size with a quality slider.",kw:["compress","jpg","kb","size","photo","resize"],
 faq:[["Is my photo uploaded?","No. It is processed on your device."],["How to get under 100 KB?","Lower the quality slider and the width until the size is small enough."]],
 render(box){box.innerHTML=`<label for="f">Choose a JPG, PNG or WebP image</label><input id="f" type="file" accept="image/jpeg,image/png,image/webp">
  <label for="q">Quality: <span id="qv">70</span>%</label><input id="q" type="range" min="10" max="100" value="70">
  <label for="w">Max width in pixels (optional)</label><input id="w" type="number" min="50" placeholder="e.g. 800">
  <button class="btn" id="go" disabled>Compress</button><p class="err" id="e" role="alert"></p><div id="o"></div>`;
  let file;$("#q").oninput=e=>$("#qv").textContent=e.target.value;
  $("#f").onchange=e=>{file=e.target.files[0];$("#e").textContent="";$("#o").innerHTML="";
   if(file&&(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>25e6)){file=null;$("#e").textContent="Choose a JPG, PNG or WebP image under 25 MB."}
   $("#go").disabled=!file};
  $("#go").onclick=async()=>{$("#go").disabled=true;$("#go").textContent="Compressing…";
   try{const b=await createImageBitmap(file);let w=b.width,h=b.height;const mw=parseInt($("#w").value);if(mw&&mw<w){h=Math.round(h*mw/w);w=mw}
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(b,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",$("#q").value/100));const url=URL.createObjectURL(blob);
    $("#o").innerHTML=`<div class="res">${(file.size/1024).toFixed(0)} KB → <b>${(blob.size/1024).toFixed(0)} KB</b> (${w}×${h}px)<br><a class="btn" href="${url}" download="compressed.jpg">Download</a></div>`;
   }catch(e){$("#e").textContent="Could not process this image."}
   $("#go").disabled=false;$("#go").textContent="Compress"}}});

// ---------- JPG to PDF ----------
T.push({slug:"jpg-to-pdf",title:"JPG to PDF",cat:"Documents",icon:"📄",desc:"Combine images into one PDF in your browser.",kw:["pdf","image","convert","jpg","png","photo"],
 faq:[["Can I add many images?","Yes, up to 30. Each becomes one A4 page, in the order you select them."],["Are my files uploaded?","No. Everything happens on your device."]],
 render(box){box.innerHTML=`<label for="f">Choose JPG or PNG images (up to 30)</label><input id="f" type="file" multiple accept="image/jpeg,image/png">
  <p id="n" class="note"></p><button class="btn" id="go" disabled>Create PDF</button><p class="err" id="e" role="alert"></p>`;
  let files=[];
  $("#f").onchange=e=>{files=[...e.target.files];$("#e").textContent="";
   if(files.length>30||files.some(f=>!/^image\/(jpeg|png)$/.test(f.type))){files=[];$("#e").textContent="Choose up to 30 JPG or PNG images only."}
   $("#n").textContent=files.length?files.length+" image(s) selected.":"";$("#go").disabled=!files.length};
  $("#go").onclick=async()=>{if(!window.jspdf)return $("#e").textContent="PDF library could not load. Check your internet and refresh.";
   $("#go").disabled=true;$("#go").textContent="Creating PDF…";
   try{const pdf=new jspdf.jsPDF({unit:"pt",format:"a4"}),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    for(let i=0;i<files.length;i++){const b=await createImageBitmap(files[i]),s=Math.min(W/b.width,H/b.height)*.95;
     const c=document.createElement("canvas");c.width=b.width;c.height=b.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0);
     if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",(W-b.width*s)/2,(H-b.height*s)/2,b.width*s,b.height*s)}
    pdf.save("images.pdf")}catch(e){$("#e").textContent="Could not create the PDF. Try different images."}
   $("#go").disabled=false;$("#go").textContent="Create PDF"}}});

// ---------- helpers ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dl=(bytes,name)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=name;a.click()};
const isPdf=f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name);

calc("savings-calculator","Savings Calculator","Money","🐖","See what a monthly deposit grows to (like an RD or SIP at a fixed rate).",["rd","sip","deposit","savings","invest"],
 [["p","Monthly deposit (₹)",5000],["r","Expected return (% per year)",7,"0.1"],["y","Years",5]],
 v=>{const i=v.r/1200,n=v.y*12;const fv=i===0?v.p*n:v.p*((Math.pow(1+i,n)-1)/i)*(1+i);return `Value after ${v.y} years<div class="big">₹${inr(fv)}</div>You deposit: ₹${inr(v.p*n)}<br>Growth: ₹${inr(fv-v.p*n)}`},
 "FV = P × ((1+i)<sup>n</sup> − 1) ÷ i × (1+i), i = monthly rate. Returns are assumptions, not guarantees.");

T.push({slug:"exam-countdown",title:"Exam Countdown",cat:"Students",icon:"⏳",desc:"Days left until your exam or deadline.",kw:["exam","days","deadline","timer"],
 faq:[["Is my date saved?","Yes, only in your own browser."]],
 render(box){box.innerHTML=`<label for="n">Name</label><input id="n" maxlength="60" placeholder="Final exam"><label for="d">Date</label><input id="d" type="date"><div class="res" id="out" aria-live="polite">Pick a date.</div>`;
  const run=()=>{const d=$("#d").value;if(!d)return;const days=Math.ceil((new Date(d+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
   $("#out").innerHTML=(esc($("#n").value)||"Your date")+`<div class="big">${days>0?days+" days left":days===0?"Today!":Math.abs(days)+" days ago"}</div>`+(days>0?`About ${Math.floor(days/7)} weeks and ${days%7} days.`:"");
   try{localStorage.setItem("cd",JSON.stringify([$("#n").value,d]))}catch(e){}};
  try{const s=JSON.parse(localStorage.getItem("cd")||"null");if(s){$("#n").value=s[0];$("#d").value=s[1]}}catch(e){}
  box.addEventListener("input",run);run()}});

// ---------- Resume builder ----------
T.push({slug:"resume-builder",title:"Resume Builder",cat:"Jobs & Career",icon:"💼",desc:"Fill in your details, pick a template, then print or save as PDF.",kw:["resume","cv","job","career","template"],
 faq:[["How do I get a PDF?","Click Print / Save as PDF, then choose “Save as PDF” as the printer."],["Is my data stored?","No. It stays in your browser and is never uploaded."],["Tips for a good resume?","Keep it to one page, lead each point with an action verb, and add numbers where you can."]],
 render(box){
  const F=[["name","Full name"],["role","Job title (optional)"],["email","Email"],["phone","Phone"],["city","City"]];
  const A=[["summary","Summary (2–3 lines)",3],["skills","Skills (separate with commas)",2],["exp","Experience (one point per line)",5],["edu","Education (one per line)",3],["proj","Projects (one per line)",3],["cert","Certifications (one per line)",2],["lang","Languages (separate with commas)",1]];
  box.innerHTML=`<label for="tpl">Template</label><select id="tpl"><option value="cv1">Classic</option><option value="cv2">Modern teal</option><option value="cv3">Side accent</option></select>`+
   F.map(f=>`<label for="${f[0]}">${f[1]}</label><input id="${f[0]}" maxlength="120">`).join("")+
   A.map(f=>`<label for="${f[0]}">${f[1]}</label><textarea id="${f[0]}" rows="${f[2]}" maxlength="3000"></textarea>`).join("")+
   `<button class="btn" id="pr">Print / Save as PDF</button><div id="cv" class="cv"></div>`;
  const g=id=>$("#"+id).value.trim();
  const ul=s=>{const l=esc(s).split("\n").filter(x=>x.trim()).map(x=>`<li>${x.replace(/^[-•*]\s*/,"")}</li>`).join("");return l?`<ul>${l}</ul>`:""};
  const p=s=>s?`<p>${esc(s)}</p>`:"";
  const sec=(t,h)=>h?`<h3>${t}</h3>${h}`:"";
  const draw=()=>{const c=$("#cv");c.className="cv "+g("tpl");
   c.innerHTML=`<h1>${esc(g("name")||"Your Name")}</h1><div>${esc(g("role"))}</div><div>${[g("email"),g("phone"),g("city")].filter(Boolean).map(esc).join(" · ")}</div>`+
    sec("Summary",p(g("summary")))+sec("Skills",p(g("skills")))+sec("Experience",ul(g("exp")))+sec("Education",ul(g("edu")))+sec("Projects",ul(g("proj")))+sec("Certifications",ul(g("cert")))+sec("Languages",p(g("lang")))};
  box.addEventListener("input",draw);draw();$("#pr").onclick=()=>window.print()}});

// ---------- PDF merger ----------
T.push({slug:"pdf-merger",title:"PDF Merger",cat:"Documents",icon:"🔗",desc:"Join several PDF files into one.",kw:["pdf","merge","combine","join"],
 faq:[["Are my PDFs uploaded?","No. Merging happens on your device."],["What order are they merged in?","The order you select them in."],["Can it merge password-protected PDFs?","No. Remove the password first."]],
 render(box){box.innerHTML=`<label for="f">Choose 2 or more PDF files</label><input id="f" type="file" multiple accept="application/pdf"><p id="n" class="note"></p><button class="btn" id="go" disabled>Merge PDFs</button><p class="err" id="e" role="alert"></p>`;
  let files=[];$("#f").onchange=e=>{files=[...e.target.files];$("#e").textContent="";
   if(files.some(f=>!isPdf(f)||f.size>50e6)){files=[];$("#e").textContent="Choose PDF files under 50 MB each."}
   $("#n").textContent=files.length?files.map(f=>f.name).join(", "):"";$("#go").disabled=files.length<2};
  $("#go").onclick=async()=>{if(!window.PDFLib)return $("#e").textContent="PDF library could not load. Check your internet and refresh.";
   $("#go").disabled=true;$("#go").textContent="Merging…";
   try{const out=await PDFLib.PDFDocument.create();for(const f of files){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(pg=>out.addPage(pg))}
    dl(await out.save(),"merged.pdf")}catch(e){$("#e").textContent="One of the files could not be read. It may be damaged or password-protected."}
   $("#go").disabled=false;$("#go").textContent="Merge PDFs"}}});

// ---------- PDF splitter ----------
T.push({slug:"pdf-splitter",title:"PDF Splitter",cat:"Documents",icon:"✂️",desc:"Extract chosen pages from a PDF into a new file.",kw:["pdf","split","extract","pages"],
 faq:[["How do I pick pages?","Type page numbers and ranges, like 1-3, 5, 8-10."],["Are my files uploaded?","No. Everything stays on your device."]],
 render(box){box.innerHTML=`<label for="f">Choose a PDF</label><input id="f" type="file" accept="application/pdf"><p id="n" class="note"></p><label for="r">Pages to keep</label><input id="r" placeholder="1-3, 5"><button class="btn" id="go" disabled>Create new PDF</button><p class="err" id="e" role="alert"></p>`;
  let file,doc;$("#f").onchange=async e=>{file=e.target.files[0];doc=null;$("#e").textContent="";$("#go").disabled=true;if(!file)return;
   if(!isPdf(file)||file.size>50e6){file=null;return $("#e").textContent="Choose a PDF under 50 MB."}
   if(!window.PDFLib)return $("#e").textContent="PDF library could not load. Check your internet and refresh.";
   try{doc=await PDFLib.PDFDocument.load(await file.arrayBuffer());$("#n").textContent=doc.getPageCount()+" pages in this file.";$("#go").disabled=false}catch(x){$("#e").textContent="This PDF could not be read. It may be damaged or password-protected."}};

const pdfPage=async(doc,n,scale)=>{const pg=await doc.getPage(n),vp=pg.getViewport({scale}),[c,x]=white(Math.ceil(vp.width),Math.ceil(vp.height));await pg.render({canvasContext:x,viewport:vp}).promise;return c};
